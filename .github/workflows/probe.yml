name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          pip install -q playwright akshare
          python -c "import akshare; print('akshare', akshare.__version__)"
          ls /usr/bin/google-chrome* 2>/dev/null || echo "无chrome"
      - name: 探测
        run: python probe3.py
