name: 每日情绪分 - 昨日数据

on:
  schedule:
    - cron: '0 17 * * *'   # 每天 17:00 UTC = 北京时间凌晨 01:00
  workflow_dispatch:        # 支持手动触发
    inputs:
      date:
        description: '补跑指定日期 YYYY-MM-DD（留空默认抓昨天）'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-sentiment
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install jieba requests akshare playwright
          sudo apt-get update -y && sudo apt-get install -y curl 2>/dev/null || true

      - name: 抓取昨日数据 + 情绪分析 + 更新看板
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python run_yesterday.py --date "${{ github.event.inputs.date }}"
          else
            python run_yesterday.py
          fi
        env:
          PYTHONIOENCODING: utf-8
          TZ: Asia/Shanghai

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "每日情绪分: $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push || echo "无可推送内容"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
